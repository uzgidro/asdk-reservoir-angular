apiVersion: apps/v1
kind: Deployment
metadata:
  name: srmt-front
  labels:
    app: srmt-front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srmt-front
  template:
    metadata:
      labels:
        app: srmt-front
    spec:
      containers:
        - name: srmt-front
          image: srmt-front:latest
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
