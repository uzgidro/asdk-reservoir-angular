apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/env: dev

images:
  - name: srmt-front
    newName: suxa/srmt-front
    newTag: latest

replicas:
  - name: srmt-front
    count: 1

patches:
  - path: service-nodeport.yaml
