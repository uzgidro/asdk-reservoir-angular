<app-card-wrapper class="h-full">
  <app-card-header slot="header" [title]="'MODSNOW'"></app-card-header>
  <div slot="body" class="h-full min-h-0 overflow-hidden">
    <div class="h-full" *ngIf="images$ | async as urls; else loader">
      <p-carousel [value]="urls" [numVisible]="itemCount" [numScroll]="itemCount" [circular]="true"
                  styleClass="h-full" *ngIf="urls.length > 0; else noImages">
        <ng-template let-url pTemplate="item">
          <div class="flex flex-col h-full justify-center mx-2 space-y-1">
            <h2 class="text-base 3xl:text-xl font-medium text-center flex-shrink-0">{{ url.name }}</h2>
            <div class="flex-1 min-h-0 flex items-center justify-center overflow-hidden">
              <img [src]="url.url" [alt]="url.name" class="max-w-full max-h-full object-contain">
            </div>
          </div>
        </ng-template>
      </p-carousel>
    </div>
  </div>
</app-card-wrapper>

<ng-template #loader>
  <app-loader size="xl"></app-loader>
</ng-template>

<ng-template #noImages>
  <p>No images found.</p>
</ng-template>
