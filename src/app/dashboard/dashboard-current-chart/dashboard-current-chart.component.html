<div class="flex flex-col h-full w-full min-h-0 overflow-hidden">
  <div class="grid grid-cols-4 justify-stretch gap-1 3xl:gap-2 flex-shrink-0">
    <button class="text-xs 3xl:text-sm px-2 py-1 3xl:px-3 3xl:py-1.5" [ngClass]="{'active-button': category == 'income', 'inactive-button': category != 'income'}"
            (click)="changeCategory('income')">Kelishi, m³/s
    </button>
    <button class="text-xs 3xl:text-sm px-2 py-1 3xl:px-3 3xl:py-1.5" [ngClass]="{'active-button': category == 'release', 'inactive-button': category != 'release'}"
            (click)="changeCategory('release')">Chiqish, m³/s
    </button>
    <button class="text-xs 3xl:text-sm px-2 py-1 3xl:px-3 3xl:py-1.5" [ngClass]="{'active-button': category == 'level', 'inactive-button': category != 'level'}"
            (click)="changeCategory('level')">Suv sathi, m
    </button>
    <button class="text-xs 3xl:text-sm px-2 py-1 3xl:px-3 3xl:py-1.5" [ngClass]="{'active-button': category == 'volume', 'inactive-button': category != 'volume'}"
            (click)="changeCategory('volume')">Suv hajmi, mln.m³
    </button>
  </div>

  <a routerLink="/recourses" class="flex flex-1 min-h-0 overflow-hidden">
    <div [id]="id" class="flex w-full h-full"></div>
  </a>
</div>
